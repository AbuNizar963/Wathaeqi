name: Format document UI review branch

on:
  push:
    branches:
      - fix/restore-document-settings-preview

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          client/src/features/document-studio/DocumentStudioPage.tsx
          client/src/features/platform-settings/PlatformDocumentSettingsPage.tsx
          scripts/verify-responsive-shell.mjs

      - name: Commit formatting
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src/features/document-studio/DocumentStudioPage.tsx client/src/features/platform-settings/PlatformDocumentSettingsPage.tsx scripts/verify-responsive-shell.mjs
            git commit -m "style: format restored document UI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
