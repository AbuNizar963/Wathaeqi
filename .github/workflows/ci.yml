name: CI

on:
  push:
    branches: ["main", "feature/flutter-document-experience", "flutter-mobile-app"]
  pull_request:
    branches: ["main", "feature/flutter-document-experience", "flutter-mobile-app"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject legacy platform dependencies
        run: |
          if git grep -niE 'vite-plugin-manus-runtime|BUILT_IN_FORGE|VITE_FRONTEND_FORGE|OAUTH_SERVER_URL|VITE_OAUTH_PORTAL_URL|OWNER_OPEN_ID|MANUS_|__MANUS__|manus' -- ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "Legacy platform dependency detected"
            exit 1
          fi

      - name: Check formatting for changed files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
              'client/**/*.ts' \
              'client/**/*.tsx' \
              'client/**/*.css' \
              'client/**/*.json' \
              'client/**/*.md' \
              'server/**/*.ts' \
              'shared/**/*.ts' \
              'scripts/**/*.mjs' \
              'drizzle/**/*.ts' \
              'package.json'
          )
          if (("${#changed_files[@]}" == 0)); then
            echo "No changed files are covered by the Prettier check."
            exit 0
          fi
          pnpm exec prettier --check "${changed_files[@]}"

      - name: Verify responsive application shell
        run: pnpm check:responsive-shell

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Verify read-only Appwrite migration inventory
        run: pnpm test -- server/_core/appwriteMigrationInventory.test.ts

      - name: Production build
        run: pnpm build
