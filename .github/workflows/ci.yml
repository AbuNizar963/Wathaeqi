name: CI

on:
  push:
    branches: ["main", "migration/appwrite-functions-transfer", "feature/enterprise-document-experience"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject legacy platform dependencies
        run: |
          if git grep -niE 'vite-plugin-manus-runtime|BUILT_IN_FORGE|VITE_FRONTEND_FORGE|OAUTH_SERVER_URL|VITE_OAUTH_PORTAL_URL|OWNER_OPEN_ID|MANUS_|__MANUS__|manus' -- ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "Legacy platform dependency detected"
            exit 1
          fi

      - name: Reject retired provider runtime dependencies
        run: |
          if git grep -niE 'supabase|SUPABASE|@supabase|drizzle/schema|drizzle-orm|drizzle-kit|DATABASE_URL|postgresql|netlify|vercel|NETLIFY|VERCEL' -- client server shared appwrite scripts package.json .env.example vite.config.ts ':!scripts/verify-appwrite-api-bundle.mjs'; then
            echo "Retired provider runtime dependency detected"
            exit 1
          fi
      - name: Check document studio formatting
        run: |
          pnpm exec prettier --check client/src/features/document-studio/DocumentStudioPage.tsx client/src/features/document-studio/ResponsiveA4Preview.tsx client/src/features/document-library/DocumentLibraryPage.tsx client/src/features/document-library/PrintDialog.tsx client/src/features/platform-settings/PlatformDocumentSettingsPage.tsx server/app.ts

      # Validate the fixed organization boundary and print-only workspace across the full project.
      - name: Check formatting
        run: pnpm lint

      - name: Verify responsive application shell
        run: pnpm check:responsive-shell

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build Appwrite owner API function
        run: pnpm build:appwrite-api

      - name: Production build
        run: pnpm build
