name: Format workspace feature branch

on:
  push:
    branches:
      - feat/restore-missing-wathaeqi-features

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restore-missing-wathaeqi-features
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source files
        run: pnpm exec prettier --write client/src/App.tsx client/src/features/workspace/WorkspacePage.tsx server/features/workspace/workspaceRouter.ts scripts/verify-responsive-shell.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx client/src/features/workspace/WorkspacePage.tsx server/features/workspace/workspaceRouter.ts scripts/verify-responsive-shell.mjs
          git commit -m "style(workspace): format restored feature modules"
          git push origin HEAD:feat/restore-missing-wathaeqi-features
