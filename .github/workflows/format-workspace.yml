name: Format authenticated workspace changes

on:
  push:
    branches:
      - feat/restore-missing-wathaeqi-features

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restore-missing-wathaeqi-features
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write client/src/components/DashboardLayout.tsx server/_core/ownerTrpc.ts server/ownerApiRouter.ts server/features/document-studio/documentStudioRouter.ts server/features/workspace/workspaceRouter.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DashboardLayout.tsx server/_core/ownerTrpc.ts server/ownerApiRouter.ts server/features/document-studio/documentStudioRouter.ts server/features/workspace/workspaceRouter.ts
          git commit -m "style(auth): format multi-user workspace changes"
          git push origin HEAD:feat/restore-missing-wathaeqi-features
