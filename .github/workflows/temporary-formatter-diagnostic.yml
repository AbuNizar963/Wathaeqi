name: Temporary formatter diagnostic
on:
  push:
    branches:
      - fix/logo-picker-gallery-and-files
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier formatted source
        run: pnpm exec prettier client/src/features/settings/DepartmentSettingsPage.tsx
