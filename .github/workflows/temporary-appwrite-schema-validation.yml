name: Temporary Appwrite schema validation

on:
  push:
    branches:
      - fix/appwrite-required-identity-audit-schema

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format schema changes
        run: >-
          pnpm exec prettier --write
          shared/appwriteSchema.ts
          shared/appwriteSchema.test.ts
          scripts/appwrite-schema.ts
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build Appwrite API
        run: pnpm build:appwrite-api
      - name: Production build
        run: pnpm build
      - name: Remove temporary workflow and sync PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-appwrite-schema-validation.yml
          git add shared/appwriteSchema.ts shared/appwriteSchema.test.ts scripts/appwrite-schema.ts
          git commit -m "chore(ci): validate and sync Appwrite schema draft"
          git push origin "HEAD:${GITHUB_REF_NAME}"
