name: One-time executive UI formatting

on:
  push:
    branches:
      - feat/executive-ui-foundation-final

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/executive-ui-foundation-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format the reviewed UI files
        run: pnpm exec prettier --write client/src/components/DashboardLayout.tsx client/src/index.css scripts/verify-responsive-shell.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "All files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DashboardLayout.tsx client/src/index.css scripts/verify-responsive-shell.mjs
          git commit -m "style: format executive UI foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
