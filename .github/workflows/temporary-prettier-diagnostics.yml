name: Temporary Prettier Diagnostics

on:
  pull_request:
    branches: ["main"]
    paths:
      - "client/src/features/document-library/DocumentLibraryPage.tsx"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier changes
        run: |
          pnpm exec prettier --write client/src/features/document-library/DocumentLibraryPage.tsx
          git --no-pager diff -- client/src/features/document-library/DocumentLibraryPage.tsx
