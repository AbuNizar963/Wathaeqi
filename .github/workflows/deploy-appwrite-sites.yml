name: Deploy Wathaeqi Web to Appwrite Sites

on:
  workflow_dispatch:
    inputs:
      reference:
        description: Appwrite VCS branch reference to deploy
        required: true
        default: main
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: appwrite-sites-production
  cancel-in-progress: false

env:
  APPWRITE_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reference || 'main' }}

jobs:
  deploy:
    name: Deploy existing Appwrite Site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate deployment reference
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPWRITE_REFERENCE" != "main" ]]; then
            echo "::error::Production deployment is restricted to the main branch."
            exit 1
          fi

      - name: Validate Appwrite secrets
        shell: bash
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_SITE_ID: ${{ secrets.APPWRITE_SITE_ID }}
        run: |
          set -euo pipefail
          for name in APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_API_KEY APPWRITE_SITE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret $name is missing."
              exit 1
            fi
          done
          endpoint="${APPWRITE_ENDPOINT%/}"
          if [[ "$endpoint" != */v1 ]]; then
            echo "::error::APPWRITE_ENDPOINT must end with /v1 (for example https://fra.cloud.appwrite.io/v1)."
            exit 1
          fi
          echo "Appwrite endpoint and required secret names are present."

      - name: Create Appwrite VCS deployment
        id: create_deployment
        shell: bash
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_SITE_ID: ${{ secrets.APPWRITE_SITE_ID }}
        run: |
          set -euo pipefail
          endpoint="${APPWRITE_ENDPOINT%/}"
          response_file="$RUNNER_TEMP/appwrite-deployment.json"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            --header "X-Appwrite-Key: $APPWRITE_API_KEY" \
            --data "$(jq -cn --arg reference "$APPWRITE_REFERENCE" '{type:"branch", reference:$reference, activate:true}')" \
            "$endpoint/sites/$APPWRITE_SITE_ID/deployments/vcs")"
          if [[ "$http_code" != "2"* ]]; then
            echo "::error::Appwrite rejected the VCS deployment request with HTTP $http_code."
            jq -r '.message // .error // "No error message returned."' "$response_file" || true
            exit 1
          fi
          deployment_id="$(jq -r '.["$id"] // empty' "$response_file")"
          if [[ -z "$deployment_id" ]]; then
            echo "::error::Appwrite did not return a deployment ID."
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Created Appwrite deployment $deployment_id for reference $APPWRITE_REFERENCE."

      - name: Wait for Appwrite deployment
        shell: bash
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_SITE_ID: ${{ secrets.APPWRITE_SITE_ID }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          endpoint="${APPWRITE_ENDPOINT%/}"
          for attempt in {1..60}; do
            response_file="$RUNNER_TEMP/appwrite-deployment-status.json"
            curl --silent --show-error \
              --output "$response_file" \
              --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
              --header "X-Appwrite-Key: $APPWRITE_API_KEY" \
              "$endpoint/sites/$APPWRITE_SITE_ID/deployments/$DEPLOYMENT_ID"
            status="$(jq -r '.status // "unknown"' "$response_file")"
            echo "Appwrite deployment status: $status"
            case "$status" in
              ready|completed|active)
                echo "Appwrite deployment completed successfully."
                exit 0
                ;;
              failed|canceled|cancelled)
                echo "::error::Appwrite deployment finished with status $status."
                jq -r '.||{} | {status, buildLogs, error, message}' "$response_file" || true
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Appwrite deployment $DEPLOYMENT_ID."
          exit 1
