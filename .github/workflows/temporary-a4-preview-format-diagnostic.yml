name: Temporary A4 preview formatter diagnostic

on:
  push:
    branches:
      - fix/a4-preview-pinch-zoom-web-20261122

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier's exact formatting diff
        run: |
          pnpm exec prettier --write client/src/features/document-studio/ResponsiveA4Preview.tsx
          git --no-pager diff -- client/src/features/document-studio/ResponsiveA4Preview.tsx
