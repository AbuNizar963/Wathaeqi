name: Temporary Workspace Prettier Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format workspace page
        run: pnpm exec prettier --write client/src/features/workspace/WorkspacePage.tsx
      - name: Export formatted file
        uses: actions/upload-artifact@v4
        with:
          name: formatted-workspace-page
          path: client/src/features/workspace/WorkspacePage.tsx
          if-no-files-found: error
