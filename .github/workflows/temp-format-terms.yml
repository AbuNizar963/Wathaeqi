name: Temporary Terms Formatter
on:
  push:
    branches:
      - fix/main-ci-terms-format
    paths:
      - .github/workflows/temp-format-terms.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and print Terms page
        run: |
          pnpm exec prettier --write client/src/pages/Terms.tsx
          cat client/src/pages/Terms.tsx
