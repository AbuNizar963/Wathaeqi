name: Temporary migration inventory formatter

on:
  push:
    branches:
      - chore/appwrite-read-only-migration-inventory

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format migration inventory files
        run: >-
          pnpm exec prettier --write
          server/_core/appwriteMigrationInventory.ts
          server/_core/appwriteMigrationInventory.test.ts
          scripts/appwrite-migration-inventory.mjs
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Migration inventory files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/appwriteMigrationInventory.ts server/_core/appwriteMigrationInventory.test.ts scripts/appwrite-migration-inventory.mjs
          git commit -m "style(migration): apply Prettier to inventory files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
