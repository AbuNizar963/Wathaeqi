name: Temporary document library format diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.14.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print Prettier's exact formatting diff
        shell: bash
        run: |
          pnpm exec prettier client/src/features/document-library/DocumentLibraryPage.tsx > /tmp/DocumentLibraryPage.formatted.tsx
          diff -u client/src/features/document-library/DocumentLibraryPage.tsx /tmp/DocumentLibraryPage.formatted.tsx || true
