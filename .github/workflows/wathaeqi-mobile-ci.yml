name: Wathaeqi Flutter CI

on:
  push:
    branches: [feat/wathaeqi-appwrite-mobile, flutter-mobile-app]
  pull_request:
    branches: [flutter-mobile-app]

permissions:
  contents: write

concurrency:
  group: wathaeqi-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze and build Wathaeqi Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit formatter and lockfile changes on feature push
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/lib mobile/pubspec.lock; then
            echo "Dart sources and pubspec lockfile are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/pubspec.lock
          git commit -m "chore: format Wathaeqi Flutter app and lock Appwrite SDK [skip ci]"
          git push
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Android debug build
        run: flutter build apk --debug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: wathaeqi-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
