name: Refresh Wathaeqi lockfile and format Appwrite foundation tests

on:
  push:
    branches:
      - feat/wathaeqi-appwrite-web
      - migration/appwrite-phase-1
      - refactor/document-studio-web
    paths:
      - package.json
      - pnpm-workspace.yaml
      - patches/**
      - server/_core/appwrite.test.ts
      - server/_core/env.ts
      - .github/workflows/refresh-wathaeqi-lock.yml

permissions:
  contents: write

concurrency:
  group: wathaeqi-web-lockfile
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Regenerate pnpm lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format Appwrite foundation tests
        run: pnpm exec prettier --write server/_core/appwrite.test.ts server/_core/env.ts
      - name: Commit generated maintenance changes if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml server/_core/appwrite.test.ts server/_core/env.ts; then
            echo "Lockfile and Appwrite foundation files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml server/_core/appwrite.test.ts server/_core/env.ts
          git commit -m "chore: refresh dependencies and format Appwrite tests"
          git push
