name: Refresh Wathaeqi web dependency lockfile

on:
  push:
    branches: [feat/wathaeqi-appwrite-web]

permissions:
  contents: write

concurrency:
  group: wathaeqi-web-lockfile
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate pnpm lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Wathaeqi Appwrite dependency lock [skip ci]"
          git push
