name: wathaeqi_mobile
description: تطبيق وثائقي لإدارة الوثائق الرسمية
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  appwrite: ^28.3.0
  file_picker: ^10.3.7
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo-400.ttf
          weight: 400
        - asset: assets/fonts/cairo-500.ttf
          weight: 500
        - asset: assets/fonts/cairo-600.ttf
          weight: 600
        - asset: assets/fonts/cairo-700.ttf
          weight: 700

